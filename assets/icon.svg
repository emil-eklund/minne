<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Minne">
  <title>Minne</title>
  <defs>
    <clipPath id="tile">
      <rect x="2" y="2" width="60" height="60" rx="15"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="#12242F"/>

  <g clip-path="url(#tile)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- envelope body -->
    <rect x="12" y="17" width="38" height="27" rx="4.5" stroke="#FBF7F0" stroke-width="3.4"/>
    <!-- flap: the two shoulders plus the valley read as an M -->
    <path d="M14.5 20 L31 33.5 L47.5 20" stroke="#E8A33D" stroke-width="3.4"/>

    <!-- magnifier, knocked out of the envelope by a wider ink stroke underneath -->
    <g stroke="#12242F" stroke-width="8">
      <circle cx="44" cy="43" r="9"/>
      <path d="M50.6 49.6 L55.5 54.5"/>
    </g>
    <g stroke="#E8A33D" stroke-width="3.4">
      <circle cx="44" cy="43" r="9"/>
      <path d="M50.6 49.6 L55.5 54.5"/>
    </g>
  </g>
</svg>
