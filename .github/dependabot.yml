version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      microsoft-identity:
        patterns: ["Microsoft.Identity*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
