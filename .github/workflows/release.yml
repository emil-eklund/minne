name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0) — produces a draft release'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Publish desktop app
        shell: bash
        run: |
          dotnet publish src/MailSearch.App \
            -c Release -r ${{ matrix.rid }} \
            -p:Version=${{ steps.version.outputs.value }} \
            -o artifacts/${{ matrix.rid }}

      - name: Stage archive contents
        shell: bash
        run: |
          staging="staging/minne-${{ steps.version.outputs.value }}-${{ matrix.rid }}"
          mkdir -p "$staging"
          # Ship only the executable; PDBs and the .NET host config stay out of the archive.
          find artifacts/${{ matrix.rid }} -maxdepth 1 -type f \
            \( -name 'minne' -o -name 'minne.exe' \) \
            -exec cp {} "$staging/" \;
          cp README.md LICENSE "$staging/"
          ls -la "$staging"

      - name: Create archive
        id: archive
        shell: bash
        run: |
          name="minne-${{ steps.version.outputs.value }}-${{ matrix.rid }}"
          cd staging
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a -tzip "../$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            tar -czf "../$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          cd ..
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            ${{ steps.archive.outputs.asset }}
            ${{ steps.archive.outputs.asset }}.sha256
          if-no-files-found: error

      # The MSI adds what the zip cannot: a Start menu entry, an Add/Remove Programs entry, and an
      # uninstall that offers to delete the mail index. Per-user, so it never asks for admin rights.
      - name: Build the Windows installer
        id: msi
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          # MSI ProductVersion is numeric only, so a prerelease tag builds without its suffix.
          $msiVersion = ($version -split '-')[0]
          # Every build needs its own ProductCode; generating it here lets the winget manifest name it.
          $productCode = '{' + [guid]::NewGuid().ToString().ToUpperInvariant() + '}'
          $name = "Minne-$version-x64.msi"
          dotnet tool install --global wix --version 6.*
          wix build packaging/windows/Minne.wxs -arch x64 `
            -d Version=$msiVersion `
            -d ProductCode=$productCode `
            -d PublishDir="$PWD/artifacts/win-x64" `
            -o $name
          $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $name" | Set-Content "$name.sha256"
          "asset=$name" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "productCode=$productCode" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'win-x64'
        with:
          name: release-windows-installer
          path: |
            ${{ steps.msi.outputs.asset }}
            ${{ steps.msi.outputs.asset }}.sha256
          if-no-files-found: error

      # Not submitted automatically: winget-pkgs takes a pull request, and the first one for a new
      # package gets human review anyway. Download this artifact and follow packaging/README.md.
      - name: Render winget manifests
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory winget-manifests | Out-Null
          Get-ChildItem packaging/winget/*.yaml | ForEach-Object {
            $dest = Join-Path winget-manifests $_.Name
            # The "# Template" note explains the placeholders to readers of this repo; once they
            # are substituted it means nothing, so it does not travel to winget-pkgs.
            (Get-Content $_.FullName -Raw).
              Replace('__VERSION__', '${{ steps.version.outputs.value }}').
              Replace('__SHA256__', '${{ steps.msi.outputs.sha256 }}'.ToUpperInvariant()).
              Replace('__PRODUCTCODE__', '${{ steps.msi.outputs.productCode }}').
              Replace('__RELEASEDATE__', (Get-Date -Format 'yyyy-MM-dd')) -split '\r?\n' |
              Where-Object { $_ -notmatch '^# Template' } |
              # utf8BOM is what winget-pkgs' own YamlCreate.ps1 writes, and its encoding check
              # wants a BOM on any manifest carrying non-ASCII characters (the description's dashes).
              Set-Content $dest -Encoding utf8BOM
          }
          Get-ChildItem winget-manifests | ForEach-Object { $_.Name }

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'win-x64'
        with:
          name: winget-manifests
          path: winget-manifests/
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # release-* only: the winget manifests are a build artifact, not a release download.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # A manual run produces a draft so the notes can be edited before anyone sees it.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.event.inputs.version) }}
