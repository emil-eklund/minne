name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste email contents, subjects or addresses. Redact anything real.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command or UI action, and the output.
      placeholder: |
        $ minne search "kickoff agenda" --mode hybrid
        error: ...
    validations: {required: true}

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations: {required: true}

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `minne --help` header, or the release tag you downloaded.
    validations: {required: true}

  - type: dropdown
    id: os
    attributes:
      label: Platform
      options: [Windows, Linux, macOS]
    validations: {required: true}

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: >
        Output of `minne config show` with the client id removed. Especially the
        embedding model, chunk size and search weights.
      render: json
