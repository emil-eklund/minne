name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste email contents, subjects or addresses. Redact anything real.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact UI action, and the status-bar message or error.
      placeholder: |
        Searched "kickoff agenda" in Hybrid mode
        status bar: error: ...
    validations: {required: true}

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations: {required: true}

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you downloaded (or the commit you built from).
    validations: {required: true}

  - type: dropdown
    id: os
    attributes:
      label: Platform
      options: [Windows, Linux, macOS]
    validations: {required: true}

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: >
        The relevant parts of config.json (Tools → Open config file), with any API key
        removed. Especially the embedding model, chunk size and search weights.
      render: json
